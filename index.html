<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>浏览器主页</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      padding: 18vh 20px 0;
    }

    .logo {
      height: 48px;
      margin-bottom: 32px;
    }

    .search-wrapper {
      position: relative;
      width: 100%;
      max-width: 600px;
    }

    .search-box {
      width: 100%;
      height: 48px;
      padding: 0 120px 0 20px;
      font-size: 16px;
      color: #333;
      background: #fff;
      border: 2px solid #e0e0e0;
      border-radius: 24px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-box:focus {
      border-color: #4e6ef2;
      box-shadow: 0 2px 12px rgba(78, 110, 242, 0.15);
    }

    .search-box::placeholder {
      color: #bbb;
    }

    .search-btn {
      position: absolute;
      right: 4px;
      top: 4px;
      height: 40px;
      padding: 0 24px;
      font-size: 15px;
      color: #fff;
      background: #4e6ef2;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .search-btn:hover {
      background: #3b5de7;
    }

    @media (max-width: 640px) {
      .search-wrapper {
        max-width: 100%;
      }

      .search-box {
        height: 44px;
        font-size: 15px;
        padding-right: 100px;
      }

      .search-btn {
        height: 36px;
        padding: 0 20px;
        font-size: 14px;
      }

      .logo {
        height: 36px;
        margin-bottom: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <img class="logo" src="Home.png" alt="Home">
    <form class="search-wrapper" id="searchForm" action="https://www.baidu.com/s" method="get" target="_self">
      <input
        class="search-box"
        type="text"
        name="wd"
        placeholder="百度一下，你就知道"
        autocomplete="off"
        autofocus
      >
      <button class="search-btn" type="submit">搜索</button>
    </form>
  </div>
</body>
</html>
