<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>百度一下，你就知道</title>
  <link rel="icon" href="https://www.baidu.com/favicon.ico">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      padding: 18vh 20px 0;
    }

    .logo {
      height: 64px;
      margin-bottom: 32px;
    }

    .search-wrapper {
      position: relative;
      width: 100%;
      max-width: 600px;
    }

    .search-box {
      width: 100%;
      height: 48px;
      padding: 0 120px 0 20px;
      font-size: 16px;
      color: #333;
      background: #fff;
      border: 2px solid #e0e0e0;
      border-radius: 24px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-box:focus {
      border-color: #4e6ef2;
      box-shadow: 0 2px 12px rgba(78, 110, 242, 0.15);
    }

    .search-box::placeholder {
      color: #bbb;
    }

    .search-btn {
      position: absolute;
      right: 4px;
      top: 4px;
      height: 40px;
      padding: 0 24px;
      font-size: 15px;
      color: #fff;
      background: #4e6ef2;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .search-btn:hover {
      background: #3b5de7;
    }

    /* 切换主题按钮 */
    .theme-toggle {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 40px;
      height: 40px;
      font-size: 20px;
      line-height: 40px;
      text-align: center;
      color: #999;
      background: none;
      border: 1px solid #ddd;
      border-radius: 50%;
      cursor: pointer;
      opacity: 0.5;
      transition: opacity 0.2s;
    }

    .theme-toggle:hover {
      opacity: 1;
    }

    @media (max-width: 640px) {
      .search-wrapper {
        max-width: 100%;
      }

      .search-box {
        height: 44px;
        font-size: 15px;
        padding-right: 100px;
      }

      .search-btn {
        height: 36px;
        padding: 0 20px;
        font-size: 14px;
      }

      .logo {
        height: 48px;
        margin-bottom: 24px;
      }
    }

    /* 墨水屏适配 */
    .eink *,
    body.eink * {
      transition: none !important;
      animation: none !important;
    }

    .eink .search-box,
    body.eink .search-box {
      color: #000;
      font-weight: 500;
      border: 3px solid #000;
      border-radius: 8px;
      box-shadow: none;
    }

    .eink .search-box:focus,
    body.eink .search-box:focus {
      border: 3px solid #000;
      box-shadow: none;
      outline: none;
    }

    .eink .search-box::placeholder,
    body.eink .search-box::placeholder {
      color: #777;
      font-weight: 400;
    }

    .eink .search-btn,
    body.eink .search-btn {
      color: #fff;
      background: #000;
      border: none;
      border-radius: 4px;
      font-weight: 500;
    }

    .eink .search-btn:hover,
    body.eink .search-btn:hover {
      background: #000;
    }

    .eink .theme-toggle,
    body.eink .theme-toggle {
      color: #000;
      border-color: #000;
      opacity: 1;
    }

    @media (monochrome) {
      * {
        transition: none !important;
        animation: none !important;
      }

      .search-box {
        color: #000;
        font-weight: 500;
        border: 3px solid #000;
        border-radius: 8px;
        box-shadow: none;
      }

      .search-box:focus {
        border: 3px solid #000;
        box-shadow: none;
        outline: none;
      }

      .search-box::placeholder {
        color: #777;
        font-weight: 400;
      }

      .search-btn {
        color: #fff;
        background: #000;
        border: none;
        border-radius: 4px;
        font-weight: 500;
      }

      .search-btn:hover {
        background: #000;
      }
    }

    @media (prefers-contrast: high) {
      .search-box {
        color: #000;
        font-weight: 500;
        border: 3px solid #000;
        border-radius: 8px;
        box-shadow: none;
      }

      .search-box:focus {
        border: 3px solid #000;
        box-shadow: none;
        outline: none;
      }

      .search-box::placeholder {
        color: #777;
        font-weight: 400;
      }

      .search-btn {
        color: #fff;
        background: #000;
        border: none;
        border-radius: 4px;
        font-weight: 500;
      }

      .search-btn:hover {
        background: #000;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <img class="logo" src="Home.png" alt="Home">
    <form class="search-wrapper" id="searchForm" action="https://www.baidu.com/s" method="get" target="_self">
      <input
        class="search-box"
        type="text"
        name="wd"
        placeholder="百度一下，你就知道"
        autocomplete="off"
        autofocus
      >
      <button class="search-btn" type="submit">百度一下</button>
    </form>
  </div>

  <button class="theme-toggle" id="themeToggle" title="切换墨水屏模式">◐</button>

  <script>
    (function () {
      var body = document.body;
      var btn = document.getElementById('themeToggle');

      // 恢复本地存储的模式
      if (localStorage.getItem('eink-mode') === '1') {
        body.classList.add('eink');
      }

      btn.addEventListener('click', function () {
        body.classList.toggle('eink');
        localStorage.setItem('eink-mode', body.classList.contains('eink') ? '1' : '0');
      });
    })();
  </script>
</body>
</html>
